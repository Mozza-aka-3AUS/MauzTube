name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Privilegi minimi: il token di Actions può solo leggere il repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # true se è configurato il keystore di firma (secret KEYSTORE_BASE64).
      # Deve stare a livello di job: le variabili di un singolo step non sono leggibili nei suoi "if".
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Il pacchetto predefinito "tools" non esiste più nell'SDK: si installa solo il necessario.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0"

      - name: Set up Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MauzTube-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Release ottimizzata firmata con la chiave di debug (senza keystore personale) ----
      - name: Build release APK (chiave di debug)
        if: env.HAS_KEYSTORE != 'true'
        run: ./gradlew assembleRelease -PdebugSign --stacktrace

      - name: Upload release APK (chiave di debug)
        if: env.HAS_KEYSTORE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MauzTube-release-debugkey-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ---- Release firmata con il keystore personale (solo se i secret sono configurati) ----
      - name: Decode keystore
        id: keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          MAUZTUBE_KEYSTORE: ${{ steps.keystore.outputs.path }}
          MAUZTUBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MAUZTUBE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAUZTUBE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload signed release APK
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MauzTube-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
