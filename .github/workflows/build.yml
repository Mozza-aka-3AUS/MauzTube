name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Privilegi minimi: il token di Actions può solo leggere il repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 37 platform
        run: sdkmanager "platforms;android-37.0"

      - name: Set up Gradle (con cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (ottimizzato; chiave di debug se mancano i secret)
        if: env.KEYSTORE_PRESENT != 'true'
        env:
          KEYSTORE_PRESENT: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK (chiave di debug)
        if: env.KEYSTORE_PRESENT != 'true'
        env:
          KEYSTORE_PRESENT: ${{ secrets.KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: MauzTube-release-debugkey-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MauzTube-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- Release firmata (solo se i secret sono configurati) ----
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.path != ''
        env:
          MAUZTUBE_KEYSTORE: ${{ steps.keystore.outputs.path }}
          MAUZTUBE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MAUZTUBE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MAUZTUBE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload release APK
        if: steps.keystore.outputs.path != ''
        uses: actions/upload-artifact@v4
        with:
          name: MauzTube-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
